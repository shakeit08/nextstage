  o.push(`<article class="nsc-card nsc-cat-${d.cat}${own?"":" nsc-locked"}${ch?" nsc-picked":""}"><div class="nsc-category"><b>${d.cat}</b><small>${k}</small></div><div class="nsc-art"${st}>${k==="BASIC"?"<span>🎤</span>":""}</div><h3>${d.name}</h3><div class="nsc-badge">${k==="BASIC"?"공통 · 항상 사용 가능":KO[d.skill]+" "+d.need+" · "+(own?TI[m]:"미획득")}</div>`);
  if(d.support){const ef={COM_01:`카드마다 체력 소모 −1 · 성공률 +${3+2*m}%p`,COM_02:`무대 카드 성공률 +${8+2*m}%p`,COM_03:`최고 배점 카드 1장 성공 시 +${5+2*m}점`}[k];o.push(`<div class="nsc-stats"><strong>준비 카드</strong><p>${ef}</p></div>`)}
  else o.push(`<div class="nsc-stats"><div><small>다음 칸 성공률</small><strong>${own?chance(d,spent,sup)+"%":"—"}</strong></div><p>성공 ${r1(d.points*rel(d))}점<br>실수 ${r1(d.fail*rel(d))}점</p></div><div class="nsc-cost">체력 ${cost(k)}</div>`);
  if(own&&!run)o.push(btn(d.support?(ch?"준비 해제":"준비 카드 선택"):(ch?`추가 편성 (${cnt[k]})`:"덱에 추가"),"add:"+k,"nsc-primary"));
  if(!own)o.push(`<small class="nsc-locktext">능력치 ${d.need} 이상 + 관련 연습</small>`);
  o.push(`</article>`)}
 o.push(`</div></div>`);
 if(!run){o.push(`<footer class="nsc-deck"><div class="nsc-deck-top"><strong>MY STAGE · ${deck.length}/5</strong>${btn("자동 편성","auto")}${btn("초기화","clear")}${btn("포지션: 보컬","noop")}</div><div class="nsc-slots">`);let used=0;
  for(let i=0;i<5;i++){const k=deck[i];o.push(`<div class="nsc-slot"><small>${i+1}</small>`);
   if(k){const c=chance(D[k],used,sup);used+=cost(k);o.push(`<b>${D[k].name}</b><span>${c}%</span><div>${i>0?btn("◀","left:"+i):""}${btn("✕","remove:"+i)}</div>`)}else o.push(`<span>＋</span>`);o.push(`</div>`)}
  o.push(`</div><div class="nsc-deck-bottom"><span>준비: ${sup?D[sup].name:"없음"} · 체력 ${used}</span>${btn("편성 확정 · 주사위 판정","roll","nsc-primary")}</div></footer>`)}
 o.push(`</div>`);ov.innerHTML=o.join("");
 ov.querySelectorAll(".nsc-filter").forEach(r=>r.onchange=()=>{filter=r.id.slice(2)});
}
function roll(){let spent=0,pts=0,best=0;const rows=[];
 if(sup==="COM_03")for(let i=1;i<5;i++)if(D[deck[i]].points>D[deck[best]].points)best=i;
 deck.forEach((k,i)=>{const d=D[k],c=chance(d,spent,sup),die=1+Math.floor(Math.random()*100),ok=die<=c;let e=(ok?d.points:d.fail)*rel(d);if(sup==="COM_03"&&i===best&&ok)e+=5+2*master(sup);e=r1(e);pts+=e;rows.push([k,c,die,ok?1:0,e]);spent+=cost(k)});
 run={rows,score:clamp(round(28+.6*pts),0,100),cost:spent}}
ov.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const[a,v]=b.dataset.a.split(":");notice="";
 if(a==="add"){const d=D[v];if(d.support)sup=sup===v?"":v;else if(deck.length>=5)notice="5칸이 모두 찼어요. ✕로 빼고 다시 넣어주세요.";else if(v!=="BASIC"&&deck.filter(x=>x===v).length>=2)notice="같은 카드는 최대 2장까지 편성할 수 있습니다.";else deck.push(v)}
 else if(a==="remove")deck.splice(+v,1);
 else if(a==="left"){const i=+v;[deck[i-1],deck[i]]=[deck[i],deck[i-1]]}
 else if(a==="clear"){deck=[];sup=""}
 else if(a==="auto"){deck=["VOC_02","CHA_02","VOC_01","VIS_02","VOC_02"];sup="COM_01"}
 else if(a==="roll"){if(deck.length<5)notice="무대 카드를 5칸 모두 편성해주세요.";else if(!deck.some(k=>k==="BASIC"||D[k].cat==="VOC"||D[k].cat==="DAN"))notice="보컬·댄스·기본 수행 중 1장 이상 필요합니다.";else{roll();play=true}}
 else if(a==="replay")play=true;
 else if(a==="reset"){run=null;play=false;deck=[];sup=""}
 else return;
 render();if(a==="roll"||a==="replay"){const sc=ov.querySelector(".nsc-scroll");if(sc)sc.scrollTop=0;if(a==="replay"){const r=ov.querySelector(".nscr");r.classList.remove("nscr-play");void r.offsetWidth;r.classList.add("nscr-play")}}
});
render();
</script></body></html>
